# ПАРТА: TLS-терминация + проксирование Go-сервера (порт 8080).
# ЭТОТ ЖЕ блок location /ws должен быть в КАЖДОМ прокси-слое
# (host-nginx, nginx в docker, балансировщик), иначе WebSocket зависает.
#
# Проверка после правки:
#   nginx -t && systemctl reload nginx
#   nginx -T | grep -A20 "location /ws"

# ВАЖНО: map объявляется на уровне http {}, не внутри server {}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream parta_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;                      # для старых nginx: listen 443 ssl http2;
    server_name slow-cat.vps.ktk-45.ru;

    ssl_certificate     /etc/letsencrypt/live/slow-cat.vps.ktk-45.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slow-cat.vps.ktk-45.ru/privkey.pem;

    client_max_body_size 20m;      # /api загрузки

    # --- WebSocket ---
    location /ws {
        proxy_pass http://parta_backend;
        proxy_http_version 1.1;                       # без этого 101 не туннелируется
        proxy_set_header Upgrade    $http_upgrade;    # hop-by-hop, nginx сам не передаёт
        proxy_set_header Connection $connection_upgrade;

        # Host обязателен: Go-сервер сверяет Origin с r.Host (иначе 403)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прокси не должен буферизовать поток кадров
        proxy_buffering off;
        proxy_cache off;

        # Соединение живёт часами; дефолтные 60s рвут сокет
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://parta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- загруженные файлы ---
    location /uploads/ {
        proxy_pass http://parta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- статика и SPA ---
    location / {
        proxy_pass http://parta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name slow-cat.vps.ktk-45.ru;
    return 301 https://$host$request_uri;
}
